name: build-android-so

on:
  # 只在手动触发或打 v* tag 时构建；push / PR 不再自动跑
  workflow_dispatch:
  push:
    tags: ['v*']

env:
  CARGO_NDK_VERSION: 4.1.2

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            target: aarch64-linux-android
          - abi: armeabi-v7a
            target: armv7-linux-androideabi

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust targets
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi
          rustc --version
          cargo --version

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version "$CARGO_NDK_VERSION" --locked

      # libdav1d-sys 用 meson 编译内置的 dav1d 1.4.3 源码
      - name: Install meson / ninja
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build python3-pip
          pip3 install --user "meson>=1.3"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          meson --version

      # 只需要 NDK，不需要整套 Android SDK。
      # 用 android-actions/setup-android 时这一步会挂（它要接管 runner 上已有的 SDK），
      # 换成 nttld/setup-ndk：只下载并解压指定版本 NDK，再给出 ndk-path。
      # NDK r28c = 28.2.13676358；r28 起默认 16KB 页对齐
      - name: Setup NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
          add-to-path: false

      - name: Export ANDROID_NDK_HOME
        run: |
          echo "ANDROID_NDK_HOME=${{ steps.ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"
          echo "NDK = ${{ steps.ndk.outputs.ndk-path }}"

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('rust/Cargo.toml', 'rust/Cargo.lock', 'vendors/**/Cargo.toml', 'vendors/**/build.rs') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-

      # build.sh 自己会做：NDK 定位、CMAKE_TOOLCHAIN_FILE、dav1d 的 meson cross file、
      # strip、把 .so 写到 dist/ 和 jniLibs/，以及「dav1d/avif 符号是否已静态链进来」的自检。
      - name: Build ${{ matrix.abi }}
        run: ./build.sh ${{ matrix.abi }}

      - uses: actions/upload-artifact@v4
        with:
          name: libflutter_avif-${{ matrix.abi }}
          path: dist/${{ matrix.abi }}/libflutter_avif.so
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Package
        run: |
          mkdir -p out
          cp artifacts/libflutter_avif-arm64-v8a/libflutter_avif.so out/libflutter_avif-arm64-v8a.so
          cp artifacts/libflutter_avif-armeabi-v7a/libflutter_avif.so out/libflutter_avif-armeabi-v7a.so
          ls -l out
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*.so
